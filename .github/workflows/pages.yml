name: Deploy RIFTWEAVE Professional Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild production bundle
        run: |
          rm -rf site
          mkdir -p site
          cat .bundle/part_*.b64 > site.b64
          base64 -d site.b64 > site.tar.gz
          echo "48b3c4f32f589723f6d7627fd2835c2f981ef5fb0f4314f8f7e22428bfe865d5  site.tar.gz" | sha256sum -c -
          tar -xzf site.tar.gz -C site

          # Overlay the corrected production shell without duplicating binary assets.
          cp site-src/index.html site/index.html
          cp site-src/style.css site/style.css
          cp site-src/game.js site/game.js

          # Clean sprite-sheet contamination left in the previously generated crops.
          # Keep this non-fatal on runners without ffmpeg.
          if command -v ffmpeg >/dev/null 2>&1; then
            clean_crop() {
              src="$1"; filter="$2"; tmp="$1.tmp.webp"
              ffmpeg -hide_banner -loglevel error -y -i "$src" -vf "$filter" -c:v libwebp -quality 92 -compression_level 4 "$tmp" &&
              mv "$tmp" "$src"
            }
            clean_crop site/assets/kael_idle.webp  "crop=iw*0.84:ih:0:0"
            clean_crop site/assets/kael_hurt.webp  "crop=iw*0.82:ih:iw*0.18:0"
            clean_crop site/assets/lyra_idle.webp  "crop=iw*0.82:ih:0:0"
            clean_crop site/assets/lyra_hurt.webp  "crop=iw*0.78:ih:iw*0.22:0"
            clean_crop site/assets/nyx_idle.webp   "crop=iw*0.82:ih:0:0"
            clean_crop site/assets/nyx_cast.webp   "crop=iw*0.82:ih:0:0"
            clean_crop site/assets/nyx_hurt.webp   "crop=iw*0.80:ih:iw*0.20:0"
            clean_crop site/assets/umbra_hurt.webp "crop=iw*0.82:ih:iw*0.18:0"
            clean_crop site/assets/glass_hurt.webp "crop=iw*0.88:ih:iw*0.12:0"
            clean_crop site/assets/boss_enraged.webp "crop=iw:ih*0.94:0:ih*0.06"
          fi

          test -f site/index.html
          test -f site/style.css
          test -f site/game.js
          test -f site/assets/kael_idle.webp
          test -f site/assets/tile_steel.webp
          test -f site/assets/boss_idle.webp
          grep -q "menu-art" site/index.html
          grep -q "SENIOR VISUAL / RESPONSIVE REBUILD" site/style.css
          grep -q "document.body.dataset.screen='home'" site/game.js
          node --check site/game.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
