name: Deploy latest RIFTWEAVE local build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: riftweave-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact local Codex source
        run: |
          base64 -d latest-src.bundle.b64 > /tmp/rift-local.tar.gz
          echo "feea3b9629f98ced663c7c02d12b0283e349a69e810f7fdda42d62aa28ad25b0  /tmp/rift-local.tar.gz" | sha256sum -c -
          tar -xzf /tmp/rift-local.tar.gz -C .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: node --check site-src/core.js && node --check site-src/board-view.js && node --check site-src/game.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - uses: actions/deploy-pages@v4
        id: deployment
