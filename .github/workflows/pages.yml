name: Deploy RIFTWEAVE Visual Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild visual game
        run: |
          mkdir -p site
          cat .bundle/part_*.b64 > site.b64
          base64 -d site.b64 > site.tar.gz
          echo "c54ee62a5772a84d50855bc52f6a447b1f71d175872680e51e347f55d98ae85f  site.tar.gz" | sha256sum -c -
          tar -xzf site.tar.gz -C site
          test -f site/index.html
          test -f site/style.css
          test -f site/game.js
          test -d site/assets
          node --check site/game.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload visual build
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
