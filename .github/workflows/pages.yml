name: Deploy RIFTWEAVE Senior Visual Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild production game
        run: |
          mkdir -p site
          cat .bundle/part_*.b64 > site.b64
          base64 -d site.b64 > site.tar.gz
          echo "a5650c03fde65213cad35e4ade56c0a543cc0642a96ac1f49867cf7935e252b4  site.tar.gz" | sha256sum -c -
          tar -xzf site.tar.gz -C site
          test -f site/index.html
          test -f site/style.css
          test -f site/game.js
          test -f site/assets/kael_idle.webp
          test -f site/assets/tile_void_plus.webp
          node --check site/game.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
